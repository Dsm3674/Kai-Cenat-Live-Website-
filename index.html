<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Kai Cenat Live — Control Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />

  <style>
    /* ===============================
       ORIGINAL CSS (UNCHANGED)
       =============================== */
    :root{
      --bg-0:#07070a;
      --bg-1:#0c0b18;
      --bg-2:#131224;
      --ink:#e9eef6;
      --muted:#9aa3b2;
      --border:#222236;
      --accent:#8c5bff;
      --accent-2:#21d4fd;
      --accent-hot:#ff3566;
      --shadow: 0 18px 60px rgba(0,0,0,.50);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Outfit",system-ui;
      color:var(--ink);
      background:
        radial-gradient(1200px 900px at 10% -10%, #1f0f40 0%, transparent 40%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0) 40%, var(--bg-2));
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:56px 18px;
    }

    .brand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .badge{
      width:46px;height:46px;border-radius:12px;
      display:grid;place-items:center;
      background:var(--accent);
      font-weight:800;
    }

    .stamp{ color:var(--muted); font-size:12px; }

    .grid{
      display:grid;
      gap:18px;
      grid-template-columns: repeat(12, 1fr);
    }

    .card{
      grid-column: span 12;
      background:#12111e;
      border:1px solid var(--border);
      border-radius:18px;
      padding:22px;
      box-shadow:var(--shadow);
    }

    @media(min-width:880px){
      .half{ grid-column: span 6; }
      .two{ grid-column: span 8; }
    }

    /* ===============================
       ADDED BUTTON + AUTH STYLES
       =============================== */
    button{
      background:linear-gradient(180deg,var(--accent),#6f3cff);
      border:none;
      border-radius:12px;
      padding:10px 16px;
      font-family:inherit;
      color:white;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 26px rgba(140,91,255,.45);
      transition:transform .15s;
    }

    button.secondary{
      background:linear-gradient(180deg,#21d4fd,#1aaed8);
      box-shadow:0 8px 26px rgba(33,212,253,.35);
    }

    button.ghost{
      background:#171630;
      box-shadow:none;
    }

    button:hover{ transform:translateY(-1px); }

    input{
      background:#171630;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      color:var(--ink);
      width:100%;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .muted{ color:var(--muted); font-size:13px; }

    footer{
      text-align:center;
      color:var(--muted);
      margin-top:28px;
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- HEADER -->
    <div class="brand">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="badge">KC</div>
        <div>
          <strong>Kai Cenat — Live Control Panel</strong><br>
          <span class="muted">Public + personal Twitch dashboard</span>
        </div>
      </div>
      <div class="stamp" id="lastUpdated">Last updated: —</div>
    </div>

    <!-- GRID -->
    <div class="grid">
      <!-- STATUS -->
      <section class="card two">
        <div id="liveBanner" style="display:none">
          <strong>🔴 LIVE</strong>
          <div>Channel: <span id="channelName"></span></div>
          <div>Viewers: <span id="viewerCount"></span></div>
          <div>Uptime: <span id="uptime"></span></div>
          <div>Game: <span id="gameName"></span></div>
          <div>Title: <span id="title"></span></div>
        </div>

        <div id="offBanner" style="display:none">
          ⚫ Offline
        </div>
      </section>

      <!-- CONTROLS -->
      <section class="card half">
        <div class="controls">
          <input id="inputUser" value="kaicenat" />
          <button id="btnApply" class="ghost">Apply</button>
          <button id="btnRefresh">Refresh</button>
        </div>

        <hr style="margin:14px 0;border:none;border-top:1px solid var(--border)">

        <!-- AUTH CONTROLS -->
        <div id="authLoggedOut">
          <a href="http://localhost:5050/auth/twitch">
            <button class="secondary">Login with Twitch</button>
          </a>
        </div>

        <div id="authLoggedIn" style="display:none">
          <div class="muted">Logged in as <strong id="meName"></strong></div>
          <div class="controls">
            <button id="btnMe">My Channel</button>
          </div>
        </div>
      </section>
    </div>

    <footer>
      Built by <a href="https://github.com/Dsm3674" target="_blank">@Dsm3674</a>
    </footer>
  </div>

  <!-- ===============================
       APP LOGIC (FULL)
       =============================== -->
  <script>
    const els = {
      liveBanner: document.getElementById('liveBanner'),
      offBanner: document.getElementById('offBanner'),
      channelName: document.getElementById('channelName'),
      viewerCount: document.getElementById('viewerCount'),
      uptime: document.getElementById('uptime'),
      title: document.getElementById('title'),
      gameName: document.getElementById('gameName'),
      lastUpdated: document.getElementById('lastUpdated'),
      inputUser: document.getElementById('inputUser'),
      btnApply: document.getElementById('btnApply'),
      btnRefresh: document.getElementById('btnRefresh'),
      btnMe: document.getElementById('btnMe'),
      authIn: document.getElementById('authLoggedIn'),
      authOut: document.getElementById('authLoggedOut'),
      meName: document.getElementById('meName')
    };

    let state = { user: 'kaicenat' };

    async function refresh(){
      const res = await fetch(`http://localhost:5050/api/live/${state.user}`);
      const data = await res.json();

      els.lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

      if(!data.live){
        els.liveBanner.style.display='none';
        els.offBanner.style.display='block';
        return;
      }

      els.offBanner.style.display='none';
      els.liveBanner.style.display='block';

      els.channelName.textContent = data.user;
      els.viewerCount.textContent = data.viewers.toLocaleString();
      els.uptime.textContent = data.uptime;
      els.title.textContent = data.title;
      els.gameName.textContent = data.game;
    }

    // PUBLIC CONTROLS
    els.btnApply.onclick = () => {
      state.user = els.inputUser.value.trim() || 'kaicenat';
      refresh();
    };
    els.btnRefresh.onclick = refresh;

    // AUTH CHECK
    fetch("http://localhost:5050/api/me")
      .then(r => r.json())
      .then(data => {
        if(data.logged_in){
          els.authOut.style.display='none';
          els.authIn.style.display='block';
          els.meName.textContent = data.user.display_name;
          els.btnMe.onclick = () => {
            state.user = data.user.login;
            els.inputUser.value = state.user;
            refresh();
          };
        }
      })
      .catch(()=>{});

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
