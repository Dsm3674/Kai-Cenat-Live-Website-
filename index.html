<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Kai Cenat Live — Control Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg-0:#07070a;
      --bg-1:#0c0b18;
      --bg-2:#131224;
      --ink:#e9eef6;
      --muted:#9aa3b2;
      --border:#222236;
      --accent:#8c5bff;
      --accent-2:#21d4fd;
      --accent-hot:#ff3566;
      --glow: rgba(140,91,255,.45);
      --shadow: 0 18px 60px rgba(0,0,0,.50);
      --round: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family:"Outfit",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 900px at 10% -10%, #1f0f40 0%, transparent 40%),
        radial-gradient(1000px 700px at 110% 10%, #072b3b 0%, transparent 42%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0) 40%, var(--bg-2));
      overflow-x:hidden;
    }

    #fx{
      position:fixed;
      inset:0;
      z-index:0;
      opacity:.25;
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:1;
      max-width:1100px;
      margin:0 auto;
      padding:56px 18px 96px;
    }

    /* ---------- HEADER ---------- */
    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .badge{
      width:46px;
      height:46px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background: conic-gradient(from 210deg, var(--accent), #6f3cff, var(--accent-2));
      box-shadow: 0 12px 36px var(--glow);
      font-weight:800;
    }

    .title h1{ margin:0;font-size:26px; }
    .title span{ color:var(--muted);font-size:13px; }

    .stamp{
      font-size:12px;
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.05);
      border:1px solid var(--border);
    }

    .rail{
      height:6px;
      border-radius:999px;
      margin:18px 0 26px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      opacity:.25;
    }

    /* ---------- GRID ---------- */
    .grid{
      display:grid;
      gap:18px;
      grid-template-columns: repeat(12, 1fr);
    }

    .card{
      grid-column: span 12;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid var(--border);
      border-radius: var(--round);
      padding:22px;
      box-shadow: var(--shadow);
    }

    @media(min-width:880px){
      .half{ grid-column: span 6; }
      .two{ grid-column: span 8; }
    }

    /* ---------- LIVE / OFFLINE ---------- */
    .liveBanner{
      display:none;
      padding:16px;
      border-radius:14px;
      background: linear-gradient(90deg, var(--accent-hot), #ff7a9a);
      color:#fff;
      font-weight:600;
      box-shadow: 0 10px 28px rgba(255,53,102,.35);
    }

    .offBanner{
      display:none;
      padding:16px;
      border-radius:14px;
      background: rgba(255,255,255,.04);
      color:var(--muted);
      border:1px dashed rgba(255,255,255,.15);
    }

    /* ---------- CONTROLS ---------- */
    input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#15142a;
      color:var(--ink);
      font-size:14px;
    }

    input:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow: 0 0 0 2px rgba(140,91,255,.25);
    }

    button{
      margin-top:10px;
      padding:12px 16px;
      border-radius:12px;
      border:none;
      font-weight:700;
      cursor:pointer;
      background: linear-gradient(180deg, var(--accent), #6f3cff);
      color:white;
      box-shadow: 0 10px 24px var(--glow);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 30px var(--glow);
    }

    button:active{
      transform: translateY(0);
      box-shadow: 0 8px 20px var(--glow);
    }

    /* ---------- FOOTER ---------- */
    footer{
      text-align:center;
      color:var(--muted);
      margin-top:28px;
      font-size:12px;
    }

    footer a{
      color:var(--accent-2);
      text-decoration:none;
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <div class="wrap">
    <div class="brand">
      <div class="logo">
        <div class="badge">KC</div>
        <div class="title">
          <h1>Kai Cenat — Live Control Panel</h1>
          <span>Real-time Twitch status</span>
        </div>
      </div>
      <div class="stamp" id="lastUpdated">Last updated: —</div>
    </div>

    <div class="rail"></div>

    <div class="grid">
      <section class="card two">
        <div id="liveBanner" class="liveBanner">
          <strong>🔴 LIVE</strong><br><br>
          Channel: <span id="channelName"></span><br>
          Viewers: <span id="viewerCount"></span><br>
          Uptime: <span id="uptime"></span><br>
          Game: <span id="gameName"></span><br>
          Title: <span id="title"></span>
        </div>

        <div id="offBanner" class="offBanner">
          ⚫ Offline
        </div>
      </section>

      <section class="card half">
        <input id="inputUser" value="kaicenat" />
        <button id="btnApply">Apply</button>
        <button id="btnRefresh">Refresh</button>
      </section>
    </div>

    <footer>
      Built by <a href="https://github.com/Dsm3674" target="_blank">@Dsm3674</a>
    </footer>
  </div>

  <script>
    const els = {
      liveBanner: document.getElementById('liveBanner'),
      offBanner: document.getElementById('offBanner'),
      channelName: document.getElementById('channelName'),
      viewerCount: document.getElementById('viewerCount'),
      uptime: document.getElementById('uptime'),
      title: document.getElementById('title'),
      gameName: document.getElementById('gameName'),
      lastUpdated: document.getElementById('lastUpdated'),
      inputUser: document.getElementById('inputUser'),
      btnApply: document.getElementById('btnApply'),
      btnRefresh: document.getElementById('btnRefresh')
    };

    let state = { user: 'kaicenat' };

    async function refresh(){
      const res = await fetch(`http://localhost:5050/api/live/${state.user}`);
      const data = await res.json();

      els.lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

      if(!data.live){
        els.liveBanner.style.display = 'none';
        els.offBanner.style.display = 'block';
        return;
      }

      els.offBanner.style.display = 'none';
      els.liveBanner.style.display = 'block';

      els.channelName.textContent = data.user;
      els.viewerCount.textContent = data.viewers.toLocaleString();
      els.uptime.textContent = data.uptime;
      els.title.textContent = data.title;
      els.gameName.textContent = data.game;
    }

    els.btnApply.onclick = () => {
      state.user = els.inputUser.value.trim() || 'kaicenat';
      refresh();
    };

    els.btnRefresh.onclick = refresh;

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
